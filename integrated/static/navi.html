<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#188038" />
  <title>金沢 日陰ナビ（ナビ表示）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root {
      --green: #188038;
      --green-dark: #0d652d;
      --blue: #1a73e8;
      --sun: #f29900;
      --red: #d93025;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #e8eaed; color: var(--text);
      font-family: "Roboto", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; }
    #mapWrap { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: #e5e3df; }
    #map {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #e5e3df;
      transform-origin: 50% 50%;
    }
    /* 歩行者視点（3D）: 地図を進行方向が上になるよう回転し、手前に傾ける */
    body.v3d #mapWrap { background: linear-gradient(180deg, #9fc5e8 0%, #dfe9f2 32%, #dfe9f2 100%); }
    body.v3d #map { clip-path: circle(50% at 50% 50%); will-change: transform; }
    body.v3d .leaflet-control-container { display: none; }
    #fog {
      position: absolute; left: 0; right: 0; pointer-events: none; display: none; z-index: 1;
      background: linear-gradient(180deg, rgba(223,233,242,1) 0%, rgba(223,233,242,.9) 30%, rgba(223,233,242,0) 100%);
    }
    body.v3d #fog { display: block; }

    .hidden { display: none !important; }

    /* ===== 設定カード（検索モード） ===== */
    #stage { position: absolute; inset: 0; overflow: hidden; }
    #setup {
      position: absolute; z-index: 1000; top: calc(var(--safe-top) + 10px); left: 10px; right: 10px;
      max-width: 460px; max-height: calc(100% - var(--sheet-space, 200px) - var(--safe-top) - 10px);
      overflow: auto; margin: 0 auto; background: #fff;
      border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.25); padding: 10px 12px 12px;
    }
    .setup-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .setup-head h1 { font-size: 15px; margin: 0; flex: 1; font-weight: 700; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: #f1f3f4; }
    .icon-btn svg { width: 22px; height: 22px; }
    .od-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .od-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .od-dot.o { border: 3px solid var(--blue); background: #fff; }
    .od-dot.d { background: var(--red); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
    .od-field {
      flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line); border-radius: 8px;
      background: #f8f9fa; padding: 9px 10px; font-size: 14px; color: var(--text); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .od-field.empty { color: var(--muted); }
    .od-field.picking { border-color: var(--blue); background: #e8f0fe; color: var(--blue); }
    .row2 { display: flex; gap: 8px; margin-top: 6px; }
    .row2 > * { flex: 1; min-width: 0; }
    select, input[type="date"] {
      font: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--text); width: 100%;
    }
    .loc-btn {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #aecbfa;
      background: #e8f0fe; color: var(--blue); border-radius: 16px; padding: 6px 10px; font-size: 12px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .loc-btn svg { width: 16px; height: 16px; }
    .loc-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .loc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tg-row {
      position: relative; display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 8px;
      border: 1px solid var(--line); border-radius: 10px; cursor: pointer; user-select: none;
    }
    .tg-cs { width: 28px; height: 32px; flex-shrink: 0; display: flex; align-items: center; }
    .tg-cs svg { width: 28px; height: 32px; display: block; }
    .tg-row.off .tg-cs { opacity: 0.4; }
    .cs-key {
      display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 8px;
      background: #e1f5fe; border-radius: 10px;
    }
    .cs-key svg { width: 36px; height: 42px; display: block; flex-shrink: 0; }
    .factor-box { margin-top: 8px; }
    .factor-title { font-size: 12px; font-weight: 700; }
    .factor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin-top: 4px; }
    .factor-grid label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .factor-hint { margin: 4px 0 0; font-size: 11px; color: var(--muted); line-height: 1.35; }
    .cs-info { margin-top: 8px; padding: 8px; border: 1px solid #b3e5fc; background: #f4fbff; border-radius: 10px; }
    .cs-info-head { display: flex; align-items: center; gap: 6px; }
    .cs-info-head b { flex: 1; font-size: 13px; line-height: 1.3; }
    .cs-info dl { margin: 6px 0 0; display: grid; grid-template-columns: 42px 1fr; gap: 2px 6px; font-size: 12px; }
    .cs-info dt { color: var(--muted); }
    .cs-info dd { margin: 0; }
    .cs-info .mini { margin-top: 8px; width: 100%; border: none; background: var(--blue); color: #fff; border-radius: 8px; padding: 8px; font-weight: 700; cursor: pointer; }
    .cs-pin { line-height: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); cursor: pointer; }
    .cs-pin svg { width: 36px; height: 42px; display: block; pointer-events: none; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.4; }
    .leaflet-popup-content .cs-pop-btn {
      margin-top: 8px; width: 100%; border: none; background: #1a73e8; color: #fff;
      border-radius: 8px; padding: 7px; font-weight: 700; cursor: pointer;
    }
    .tg-text { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.25; }
    .tg-text small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
    .tg-row input { position: absolute; opacity: 0; width: 0; height: 0; }
    .tg-sw { width: 36px; height: 20px; border-radius: 10px; background: #bdc1c6; position: relative; transition: background .15s; flex-shrink: 0; }
    .tg-sw::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s;
    }
    .tg-row input:checked + .tg-sw { background: var(--blue); }
    .tg-row input:checked + .tg-sw::after { left: 18px; }
    .tg-row input:focus-visible + .tg-sw { outline: 2px solid var(--blue); outline-offset: 2px; }
    .seg { display: flex; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button {
      flex: 1; border: none; background: #fff; padding: 7px 4px; font-size: 13px; font-weight: 700;
      color: var(--muted); cursor: pointer; line-height: 1.2;
    }
    .seg button small { display: block; font-size: 10px; font-weight: 400; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.on[data-sys="old"] { background: #e8f0fe; color: var(--blue); }
    .seg button.on[data-sys="new"] { background: #e6f4ea; color: var(--green); }

    /* ===== 案内バナー（ナビモード） ===== */
    #banner {
      position: absolute; z-index: 1000; top: calc(var(--safe-top) + 10px); left: 10px; right: 10px;
      max-width: 460px; margin: 0 auto;
    }
    .bn-main {
      background: var(--green); color: #fff; border-radius: 14px; display: flex; align-items: center;
      gap: 12px; padding: 12px 10px 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.35); position: relative;
    }
    .bn-main.with-then { border-bottom-left-radius: 0; }
    .bn-main.off { background: var(--red); }
    .bn-main.done { background: var(--green-dark); }
    .bn-arrow { width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .bn-arrow svg { width: 56px; height: 56px; }
    .bn-text { flex: 1; min-width: 0; }
    .bn-dist { font-size: 15px; font-weight: 500; opacity: .95; }
    .bn-road { font-size: 24px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    .bn-sub { font-size: 12px; opacity: .9; margin-top: 2px; }
    .bn-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(255,255,255,.18);
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .bn-btn svg { width: 22px; height: 22px; }
    .bn-then {
      display: inline-flex; align-items: center; gap: 6px; background: var(--green-dark); color: #fff;
      padding: 6px 12px 7px; border-radius: 0 0 12px 12px; font-size: 14px; font-weight: 500;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .bn-then svg { width: 20px; height: 20px; }

    /* ===== 右側の丸ボタン ===== */
    #fabs {
      position: absolute; z-index: 1000; right: 12px; top: calc(var(--safe-top) + 168px);
      display: flex; flex-direction: column; gap: 12px;
    }
    .fab {
      width: 48px; height: 48px; border-radius: 50%; border: none; background: #fff; color: #3c4043;
      box-shadow: 0 1px 4px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px; font-weight: 700; flex-direction: column; line-height: 1.05;
    }
    .fab svg { width: 22px; height: 22px; }
    .fab.on { color: var(--blue); }
    .fab .fab-l { font-size: 9px; font-weight: 500; margin-top: 1px; }
    .fab.sys-old { color: var(--blue); }
    .fab.sys-new { color: var(--green); }

    /* ===== 左下の日陰標識 ===== */
    #signs {
      position: absolute; z-index: 1000; left: 12px; bottom: calc(var(--safe-bottom) + 132px);
      display: flex; gap: 6px;
    }
    .sign {
      background: #fff; border: 2px solid #202124; border-radius: 8px; padding: 3px 6px 4px; text-align: center;
      min-width: 50px; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .sign .v { font-size: 20px; font-weight: 700; line-height: 1.05; }
    .sign .l { font-size: 9px; color: #3c4043; }
    .sign.sun .v { color: var(--sun); }
    .sign.shade .v { color: var(--blue); }

    #recenter {
      position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%);
      bottom: calc(var(--safe-bottom) + 132px); border: none; background: #fff; color: var(--blue);
      border-radius: 20px; padding: 9px 16px; font-size: 14px; font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    #recenter svg { width: 18px; height: 18px; }

    #legend {
      position: absolute; z-index: 999; left: 12px; bottom: calc(var(--safe-bottom) + 186px);
      background: rgba(255,255,255,.92); border-radius: 8px; padding: 4px 8px; font-size: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    #legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 3px; }
    #legend .lg-cs { display: flex; align-items: flex-start; gap: 6px; margin-top: 4px; line-height: 1.25; max-width: 180px; }
    #legend .lg-cs svg { width: 28px; height: 32px; flex-shrink: 0; }

    /* ===== 下部シート ===== */
    #sheet {
      position: absolute; z-index: 1001; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
      background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -2px 10px rgba(0,0,0,.2);
      padding: 8px 16px calc(var(--safe-bottom) + 12px);
    }
    .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 8px; }
    #uiSwitch { display: flex; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    #uiSwitch button {
      flex: 1; border: none; background: #fff; padding: 7px 4px; font-size: 13px; font-weight: 700;
      color: var(--muted); cursor: pointer;
    }
    #uiSwitch button + button { border-left: 1px solid var(--line); }
    #uiSwitch button.on { background: #e8f0fe; color: var(--blue); }
    .sheet-fab {
      position: absolute; right: 12px; top: -64px; width: 48px; height: 48px; border-radius: 50%; border: none;
      background: #fff; color: #5f6368; box-shadow: 0 1px 4px rgba(0,0,0,.35); display: flex;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .sheet-fab svg { width: 24px; height: 24px; }
    .sheet-fab.on { color: var(--blue); }
    body.nav .sheet-fab { display: none; }
    .sheet-attr {
      position: absolute; right: 4px; top: -15px; font-size: 9px; line-height: 13px; padding: 0 4px;
      background: rgba(255,255,255,.75); border-radius: 3px; color: #3c4043;
    }
    .sheet-attr a { color: inherit; }
    .nav-row { display: flex; align-items: center; gap: 12px; }
    .round {
      width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: #3c4043; flex-shrink: 0;
    }
    .round svg { width: 24px; height: 24px; }
    .round.danger { background: var(--red); border: none; color: #fff; }
    .eta { flex: 1; text-align: center; min-width: 0; }
    .eta-time { font-size: 26px; font-weight: 700; color: var(--green); line-height: 1.15; }
    .eta-sub { font-size: 14px; color: var(--muted); }
    .eta-sys { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .sim-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 12px; font-size: 13px;
      cursor: pointer; color: #3c4043; display: inline-flex; align-items: center; gap: 4px;
    }
    .chip.on { background: #e8f0fe; border-color: #aecbfa; color: var(--blue); }
    .chip svg { width: 16px; height: 16px; }

    .sum-time { font-size: 24px; font-weight: 700; color: var(--green); }
    .sum-time span { font-size: 16px; color: var(--muted); font-weight: 400; margin-left: 6px; }
    .sum-meta { font-size: 13px; color: var(--muted); margin: 2px 0 10px; line-height: 1.5; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    #btnClearPts { flex: 1 0 100%; }
    .pill {
      border: 1px solid var(--line); background: #fff; color: var(--blue); border-radius: 20px;
      padding: 10px 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .pill svg { width: 18px; height: 18px; }
    .pill.primary { background: var(--blue); border-color: var(--blue); color: #fff; flex: 1; }
    .pill:disabled { opacity: .5; cursor: default; }
    .status { font-size: 13px; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
    .status.err { color: var(--red); }
    .status.ok { color: var(--green); }

    /* ===== ステップ一覧 ===== */
    #stepsPanel {
      position: absolute; z-index: 1002; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
      height: 72%; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.3);
      display: flex; flex-direction: column;
    }
    .sp-head { display: flex; align-items: center; padding: 12px 12px 8px 16px; border-bottom: 1px solid var(--line); }
    .sp-head h2 { flex: 1; margin: 0; font-size: 16px; }
    .sp-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 400; }
    #stepsList { overflow-y: auto; flex: 1; padding: 4px 0 calc(var(--safe-bottom) + 8px); }
    .st-item { display: flex; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
    .st-item:hover { background: #f8f9fa; }
    .st-item.past { opacity: .45; }
    .st-item.cur { background: #e6f4ea; }
    .st-ico { width: 30px; height: 30px; flex-shrink: 0; color: #3c4043; }
    .st-ico svg { width: 30px; height: 30px; }
    .st-body { flex: 1; min-width: 0; }
    .st-ins { font-size: 14px; font-weight: 500; }
    .st-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
    .shbar { width: 60px; height: 6px; border-radius: 3px; background: #fde7b0; overflow: hidden; }
    .shbar i { display: block; height: 100%; background: var(--blue); }

    #navHelp {
      position: absolute; z-index: 1005; inset: 0; background: rgba(32,33,36,.45);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .help-card {
      background: #fff; border-radius: 16px; max-width: 420px; width: 100%; max-height: 90%; overflow-y: auto;
      padding: 16px 18px; box-shadow: 0 4px 20px rgba(0,0,0,.35);
    }
    .help-card h2 { margin: 0 0 8px; font-size: 17px; }
    .help-card ul { margin: 0 0 14px; padding-left: 18px; font-size: 14px; line-height: 1.6; }
    .help-card li { margin-bottom: 6px; }
    .help-card .pill { width: 100%; }

    #toast {
      position: absolute; z-index: 1003; left: 50%; transform: translateX(-50%);
      top: calc(var(--safe-top) + 170px); background: rgba(32,33,36,.92); color: #fff; padding: 9px 14px;
      border-radius: 10px; font-size: 13px; max-width: 86%; text-align: center; pointer-events: none;
      transition: opacity .25s; opacity: 0;
    }
    #toast.show { opacity: 1; }

    #busy {
      position: absolute; z-index: 1004; inset: 0; background: rgba(255,255,255,.55);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      font-size: 14px; color: var(--text);
    }
    .spinner { width: 36px; height: 36px; border: 4px solid #d2e3fc; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .me-wrap { width: 44px; height: 44px; }
    .me { width: 44px; height: 44px; transition: transform .2s linear; }
    .my-wrap { position: relative; width: 60px; height: 60px; }
    .my-beam { position: absolute; inset: 0; width: 60px; height: 60px; display: none; }
    .my-wrap.has-heading .my-beam { display: block; }
    .my-dot {
      position: absolute; left: 21px; top: 21px; width: 18px; height: 18px; border-radius: 50%;
      background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 1px 4px rgba(0,0,0,.35);
    }
    .my-dot::after {
      content: ""; position: absolute; inset: -10px; border-radius: 50%; background: rgba(26,115,232,.28);
      animation: mypulse 2s ease-out infinite; z-index: -1;
    }
    @keyframes mypulse { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    .pin-ico { filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
    .cs-badge {
      background: #fff; border: 2px solid #01579b; color: #01579b; border-radius: 10px; font-size: 11px;
      font-weight: 700; padding: 1px 5px; box-shadow: 0 1px 3px rgba(0,0,0,.3); white-space: nowrap;
    }

    body.ui-pc #setup, body.ui-pc #banner { left: 16px; right: auto; width: min(420px, calc(100% - 32px)); margin: 0; }
    body.ui-pc #sheet, body.ui-pc #stepsPanel {
      left: 16px; right: auto; width: min(420px, calc(100% - 32px)); margin: 0; bottom: 16px; border-radius: 16px;
    }
    body.ui-pc #stepsPanel { height: 70%; }
    body.ui-pc #signs, body.ui-pc #recenter { bottom: 156px; }
    body.ui-pc #recenter, body.ui-pc #toast { left: calc(16px + min(420px, calc(100% - 32px)) / 2); }
    body.ui-pc #legend { bottom: 210px; }
    body.ui-pc.setup #legend { display: block; bottom: 16px; left: auto; right: 60px; }
    body.ui-pc #fabs { top: 24px; }
    /* スマホは上の設定と下のシートのあいだに地図を残す */
    body.ui-phone #setup {
      max-height: max(140px, min(280px, calc(100% - var(--sheet-space, 220px) - 150px)));
      -webkit-overflow-scrolling: touch;
    }
    body.ui-phone #legend {
      left: 10px;
      right: auto;
      bottom: calc(var(--sheet-space, 220px) + 4px);
      max-width: min(210px, calc(100% - 78px));
    }
    body.ui-phone #signs,
    body.ui-phone #recenter {
      bottom: calc(var(--sheet-space, 220px) + 8px);
    }
    body.ui-phone.framed { background: #c5c9ce; }

      async function requestRoute(sysKey, visitCsId, noCs) {

      function buildRoute(res, sysKey) {
        var st = res.stats || {};
        var ll = (res.coordinates_latlon || []).map(function (p) { return [p[0], p[1]]; });
        if (ll.length < 2) throw new Error('route has no geometry');
        var lat0 = ll[0][0], lon0 = ll[0][1];
        var kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
        var xy = ll.map(function (p) { return [(p[1] - lon0) * kx, (p[0] - lat0) * ky]; });
        var cum = [0];
        for (var i = 1; i < xy.length; i++) {
          cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
        }
        var rawSteps = (isEn ? st.nav_steps_en : st.nav_steps) || st.nav_steps || [];
        if (!rawSteps.length) {
          rawSteps = [
            { type: 'depart', modifier: 'straight', road: '', instruction: isEn ? 'Head out' : '出発', start_index: 0, distance_m: cum[cum.length - 1], shade_frac: st.mean_shadow_fraction_on_path || 0 },
            { type: 'arrive', modifier: 'straight', road: '', instruction: isEn ? 'Arrive' : '目的地に到着', start_index: ll.length - 1, distance_m: 0, shade_frac: 0 }
          ];
        }
        var steps = rawSteps.map(function (s) {
          var idx = Math.max(0, Math.min(ll.length - 1, s.start_index | 0));
          return Object.assign({}, s, { along: cum[idx], idx: idx });
        });
        var wp = null;
        for (var k = 0; k < steps.length; k++) { if (steps[k].type === 'waypoint') { wp = steps[k]; break; } }
        var cv = st.cooling_shelter_visit || {};
        var fac = st.factors || {};
        return {
          sys: sysKey, res: res, st: st, ll: ll, xy: xy, cum: cum, total: cum[cum.length - 1],
          kx: kx, ky: ky, lat0: lat0, lon0: lon0,
          segShade: st.edge_shade_fractions || [],
          steps: steps,
          csAlong: wp ? wp.along : null,
          csId: cv.cs_id != null ? cv.cs_id : null,
          csName: cv.cs_name || '',
          csWpIdx: wp ? wp.idx : null,
          walk: fac.walk_speed_m_s || baseFactors.walk_speed_m_s || 1.2,
          dwell: cv.enabled === false || cv.cs_id == null ? 0
            : (fac.cs_dwell_time_s != null ? fac.cs_dwell_time_s : (baseFactors.cs_dwell_time_s || 600)),
          meanShade: st.mean_shadow_fraction_on_path || 0
        };
      }

      function projectOnRoute(r, lat, lon) {
        var px = (lon - r.lon0) * r.kx, py = (lat - r.lat0) * r.ky;
        var best = { dist: Infinity, along: 0, seg: 0 };
        for (var i = 0; i < r.xy.length - 1; i++) {
          var ax = r.xy[i][0], ay = r.xy[i][1], bx = r.xy[i + 1][0], by = r.xy[i + 1][1];
          var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
          var t = L2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
          t = Math.max(0, Math.min(1, t));
          var qx = ax + t * dx, qy = ay + t * dy;
          var d = Math.hypot(px - qx, py - qy);
          if (d < best.dist) best = { dist: d, along: r.cum[i] + t * Math.sqrt(L2), seg: i };
        }
        return best;
      }
      function segAt(r, along) {
        var lo = 0, hi = r.cum.length - 2;
        if (along <= 0) return 0;
        if (along >= r.total) return Math.max(0, r.cum.length - 2);
        while (lo < hi) {
          var mid = (lo + hi + 1) >> 1;
          if (r.cum[mid] <= along) lo = mid; else hi = mid - 1;
        }
        return lo;
      }
      function pointAt(r, along) {
        var i = segAt(r, along);
        var segLen = r.cum[i + 1] - r.cum[i];
        var t = segLen > 0 ? (along - r.cum[i]) / segLen : 0;
        t = Math.max(0, Math.min(1, t));
        var a = r.ll[i], b = r.ll[i + 1];
        var dx = r.xy[i + 1][0] - r.xy[i][0], dy = r.xy[i + 1][1] - r.xy[i][1];
        var brg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
        return { latlng: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], bearing: brg, seg: i };
      }
      function shadeAhead(r, along) {
        var i0 = segAt(r, along), tot = 0, sh = 0;
        for (var i = i0; i < r.cum.length - 1; i++) {
          var s0 = Math.max(r.cum[i], along), s1 = r.cum[i + 1];
          var len = Math.max(0, s1 - s0);
          tot += len;
          sh += len * (r.segShade[i] || 0);
        }
        return tot > 0 ? sh / tot : 0;
      }

      // ---------- 描画（見た目だけ間引く。案内の座標 r.ll は変えない） ----------
      function simplifyLatLngs(ll, tolM) {
        if (!ll || ll.length < 3) return (ll || []).slice();
        var lat0 = ll[0][0] * Math.PI / 180;
        var mLat = 111320;
        var mLon = 111320 * Math.cos(lat0);
        var xy = ll.map(function (p) {
          return [(p[1] - ll[0][1]) * mLon, (p[0] - ll[0][0]) * mLat];
        });
        function perp(p, a, b) {
          var dx = b[0] - a[0], dy = b[1] - a[1];
          var len = Math.hypot(dx, dy);
          if (len < 1e-9) return Math.hypot(p[0] - a[0], p[1] - a[1]);
          return Math.abs((p[0] - a[0]) * dy - (p[1] - a[1]) * dx) / len;
        }
        var keep = { 0: true };
        keep[ll.length - 1] = true;
        function rec(i, j) {
          var maxD = 0, idx = -1;
          for (var k = i + 1; k < j; k++) {
            var d = perp(xy[k], xy[i], xy[j]);
            if (d > maxD) { maxD = d; idx = k; }
          }
          if (idx >= 0 && maxD > tolM) {
            keep[idx] = true;
            rec(i, idx);
            rec(idx, j);
          }
        }
        rec(0, ll.length - 1);
        var out = [];
        for (var i = 0; i < ll.length; i++) if (keep[i]) out.push(ll[i]);
        return out;
      }
      function dropSpikes(ll) {
        var pts = (ll || []).slice();
        var guard = 0;
        while (pts.length >= 3 && guard++ < 80) {
          var lat0 = pts[0][0] * Math.PI / 180;
          var mLat = 111320;
          var mLon = 111320 * Math.cos(lat0);
          var xy = pts.map(function (p) {
            return [(p[1] - pts[0][1]) * mLon, (p[0] - pts[0][0]) * mLat];
          });
          var removed = false;
          for (var i = 1; i < pts.length - 1; i++) {
            var ax = xy[i][0] - xy[i - 1][0], ay = xy[i][1] - xy[i - 1][1];
            var bx = xy[i + 1][0] - xy[i][0], by = xy[i + 1][1] - xy[i][1];
            var la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
            if (la < 1.5) { pts.splice(i, 1); removed = true; break; }
            if (lb < 0.4) continue;
            var dot = (ax * bx + ay * by) / (la * lb);
            var back = Math.hypot(xy[i + 1][0] - xy[i - 1][0], xy[i + 1][1] - xy[i - 1][1]);
            var spur = Math.min(la, lb) < 80 && (dot < -0.75 || (back + 12 < la + lb && back < Math.max(la, lb) * 0.85));
            if (spur) {
              pts.splice(i, 1);
              removed = true;
              break;
            }
          }
          if (!removed) break;
        }
        return pts;
      }
      function distM(a, b) {
        var lat0 = ((a[0] + b[0]) / 2) * Math.PI / 180;
        var dx = (b[1] - a[1]) * 111320 * Math.cos(lat0);
        var dy = (b[0] - a[0]) * 111320;
        return Math.hypot(dx, dy);
      }
      function dropLoops(ll) {
        var pts = (ll || []).slice();
        var guard = 0;
        while (pts.length >= 4 && guard++ < 40) {
          var cum = [0];
          for (var i = 1; i < pts.length; i++) cum.push(cum[i - 1] + distM(pts[i - 1], pts[i]));
          var removed = false;
          for (var i = 0; i < pts.length - 2 && !removed; i++) {
            for (var j = i + 2; j < pts.length; j++) {
              var along = cum[j] - cum[i];
              if (along > 220) break;
              var straight = distM(pts[i], pts[j]);
              if (straight < 28 && along > straight + 30) {
                pts.splice(i + 1, j - i - 1);
                removed = true;
                break;
              }
            }
          }
          if (!removed) break;
        }
        return pts;
      }
      function displayLatLngs(ll) {
        return dropLoops(dropSpikes(simplifyLatLngs(dropLoops(dropSpikes(ll)), 8)));
      }
      function shadePieces(r) {
        var simple = displayLatLngs(r.ll);
        if (!(shadeColoring && r.segShade && r.segShade.length && r.cum)) {
          return [{ ll: simple, shade: false }];
        }
        function nearest(pt) {
          var best = 0, bestD = 1e18;
          for (var i = 0; i < r.ll.length; i++) {
            var dlat = r.ll[i][0] - pt[0], dlon = r.ll[i][1] - pt[1];
            var d = dlat * dlat + dlon * dlon;
            if (d < bestD) { bestD = d; best = i; }
          }
          return best;
        }
        var idx = [];
        var last = 0;
        simple.forEach(function (pt) {
          var j = nearest(pt);
          if (j < last) j = last;
          idx.push(j);
          last = j;
        });
        function shadedSpan(a, b) {
          if (b <= a) return (r.segShade[Math.min(a, r.segShade.length - 1)] || 0) >= 0.5;
          var sh = 0, len = 0;
          for (var i = a; i < b && i < r.segShade.length; i++) {
            var seg = Math.max(0, (r.cum[i + 1] || 0) - (r.cum[i] || 0));
            sh += seg * (r.segShade[i] || 0);
            len += seg;
          }
          return len > 0 ? (sh / len) >= 0.5 : false;
        }
        var colored = [];
        for (var s = 1; s < simple.length; s++) {
          var shade = shadedSpan(idx[s - 1], idx[s]);
          var prev = colored[colored.length - 1];
          if (prev && prev.shade === shade) prev.ll.push(simple[s]);
          else colored.push({ ll: [simple[s - 1], simple[s]], shade: shade });
        }
        return colored.length ? colored : [{ ll: simple, shade: false }];
      }
      function drawRoute(r, fit) {
        routeGroup.clearLayers();
        traveledLine = null;
        var plainColor = r.sys === 'new' ? '#188038' : '#1a73e8';
        var useShade = !!(shadeColoring && r.segShade && r.segShade.length);
        var pieces = shadePieces(r);
        var casing = [];
        pieces.forEach(function (p) {
          if (casing.length) casing.pop();
          casing = casing.concat(p.ll);
        });
        var stroke = { weight: 7, opacity: 1, lineCap: 'round', lineJoin: 'round', smoothFactor: 0, interactive: false };
        L.polyline(casing, { color: '#ffffff', weight: 12, opacity: 0.95, lineCap: 'round', lineJoin: 'round', smoothFactor: 0, interactive: false }).addTo(routeGroup);
        pieces.forEach(function (p) {
          L.polyline(p.ll, Object.assign({ color: useShade ? (p.shade ? '#1a73e8' : '#f29900') : plainColor }, stroke)).addTo(routeGroup);
        });
        $('lgShadeRow').classList.toggle('hidden', !useShade);
        $('lgSunRow').classList.toggle('hidden', !useShade);
        $('legend').classList.remove('hidden');
        traveledLine = L.polyline([], { color: '#9aa0a6', weight: 7, opacity: 1, lineCap: 'round', lineJoin: 'round', smoothFactor: 0, interactive: false }).addTo(routeGroup);

        if (r.csId != null) {
          var f = csFeatureById(r.csId);
          var pos = f ? [f.geometry.coordinates[1], f.geometry.coordinates[0]] : (r.csWpIdx != null ? r.ll[r.csWpIdx] : null);
          if (pos) {
            var visit = L.marker(pos, {
              icon: L.divIcon({
                className: '', iconSize: [36, 42], iconAnchor: [18, 40],
                html: '<div class="cs-pin">' + CS_ICON_SVG + '</div>'
              }),
              zIndexOffset: 900,
              bubblingMouseEvents: false
            }).addTo(routeGroup);
            if (f) {
              var vp = f.properties || {};
              visit.bindPopup(csPopupHtml(vp), {
                maxWidth: 280, offset: [0, -32], autoPan: true,
                autoPanPaddingTopLeft: L.point(24, 80), autoPanPaddingBottomRight: L.point(24, 140)
              });
              visit.on('click', function (ev) {
                L.DomEvent.stopPropagation(ev);
                openCsPopup(visit, vp);
              });
            } else {
              visit.bindTooltip(r.csName || T('lgCs'), { direction: 'top', offset: [0, -36] });
            }
          }
        }
        if (fit) map.fitBounds(L.latLngBounds(r.ll), fitPadding());
      }
      function fitPadding() {
        if (window.innerWidth >= 900) return { paddingTopLeft: [460, 40], paddingBottomRight: [80, 40], maxZoom: 17 };
        var su = $('setup').getBoundingClientRect();
        var sh = $('sheet').getBoundingClientRect();
        var top = su.height ? su.bottom + 16 : 80;
        var bottom = sh.height ? window.innerHeight - sh.top + 24 : 80;
        return { paddingTopLeft: [30, Math.round(top)], paddingBottomRight: [30, Math.round(bottom)], maxZoom: 17 };
      }

      function showSummary(r) {
        var walkS = r.total / r.walk;
        $('sumBox').classList.remove('hidden');
        $('sumTime').innerHTML = fmtDur(walkS + r.dwell) + '<span>(' + fmtDist(r.total) + ')</span>';
        var lines = [];
        lines.push(T('shadeRoute') + ' ' + pct(r.meanShade) + ' · ' + sysLabel(r.sys));
        if (r.csName && r.dwell > 0) {
          lines.push(T('stopCs') + ': ' + r.csName);
          lines.push(T('walk') + ' ' + fmtDur(walkS) + ' + ' + T('dwell') + ' ' + fmtDur(r.dwell));
        } else {
          lines.push(T('noCs'));
        }
        $('sumMeta').innerHTML = lines.map(function (s) { return escapeHtml(s); }).join('<br>');
        $('btnSearch').classList.add('hidden');
        $('btnStart').classList.remove('hidden');
        $('btnStepsSetup').classList.remove('hidden');
        document.body.classList.add('has-summary');
        setStatus(T('readyRoute'), 'ok');
        requestAnimationFrame(fitSetup);
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // ---------- 検索 ----------
      $('btnSearch').onclick = async function () {
        if (!orig || !dest) { setStatus(T('needOD'), 'err'); return; }
        if (!factorActive(collectFactors())) { setStatus(T('factorNeed'), 'err'); return; }
        busy(true, T('computing'));
        try {
          var res = await requestRoute(sys, null);
          var r = buildRoute(res, sys);
          routes = { old: null, new: null };
          routes[sys] = r;
          fixedVisitCsId = r.csId;
          drawRoute(r, true);
          showSummary(r);
        } catch (e) {
          setStatus(T('errPrefix') + e.message, 'err');
        } finally {
          busy(false);
        }
      };

      // ---------- ステップ一覧 ----------
      function openSteps() {
        var r = nav ? nav.route : routes[sys];
        if (!r) return;
        $('spSub').textContent = sysLabel(r.sys) + ' · ' + fmtDist(r.total) + ' · ' + T('shadeRoute') + ' ' + pct(r.meanShade);
        var list = $('stepsList');
        list.innerHTML = '';
        var curIdx = nav ? currentStepIndex(nav.route, nav.along) : -1;
        r.steps.forEach(function (s, i) {
          var item = document.createElement('div');
          item.className = 'st-item' + (nav && i < curIdx ? ' past' : '') + (nav && i === curIdx ? ' cur' : '');
          var metaHtml = '';
          if (s.type !== 'arrive' && s.type !== 'waypoint') {
            metaHtml = '<span>' + fmtDist(s.distance_m) + '</span>' +
              '<span class="shbar" title="' + T('shade') + ' ' + pct(s.shade_frac) + '"><i style="width:' + Math.round((s.shade_frac || 0) * 100) + '%"></i></span>' +
              '<span>' + T('shade') + ' ' + pct(s.shade_frac) + '</span>';
          } else if (s.type === 'waypoint') {
            metaHtml = '<span>' + T('dwell') + ' ' + fmtDur(r.dwell) + '</span>';
          }
          item.innerHTML = '<div class="st-ico" style="color:' + (s.type === 'waypoint' ? '#01579b' : '#3c4043') + '">' + arrowSvg(s) + '</div>' +
            '<div class="st-body"><div class="st-ins">' + escapeHtml(s.instruction || '') + '</div>' +
            '<div class="st-meta">' + metaHtml + '</div></div>';
          item.onclick = function () {
            closeSteps();
            if (nav) {
              nav.follow = false;
              if (view3d) setView3d(false);
              $('recenter').classList.remove('hidden');
            }
            map.setView(r.ll[s.idx], 18);
          };
          list.appendChild(item);
        });
        $('stepsPanel').classList.remove('hidden');
      }
      function closeSteps() { $('stepsPanel').classList.add('hidden'); }
      $('btnStepsSetup').onclick = openSteps;
      $('btnStepsNav').onclick = openSteps;
      $('btnStepsClose').onclick = closeSteps;

      // ---------- ナビ ----------
      function currentStepIndex(r, along) {
        var idx = 0;
        for (var i = 0; i < r.steps.length; i++) {
          if (r.steps[i].type === 'arrive') break;
          if (r.steps[i].along <= along + 0.5) idx = i;
        }
        return idx;
      }
      function nextManeuvers(r, along, csPassed) {
        var out = [];
        for (var i = 1; i < r.steps.length; i++) {
          var s = r.steps[i];
          var ahead = s.along > along + 0.5 || (s.type === 'waypoint' && !csPassed) || s.type === 'arrive';
          if (s.type === 'waypoint' && csPassed) ahead = false;
          if (ahead) { out.push({ step: s, i: i }); }
          if (out.length >= 2) break;
        }
        return out;
      }

      function startNav() {
        var r = routes[sys];
        if (!r) return;
        closeSteps();
        var h0 = pointAt(r, 0).bearing;
        nav = {
          route: r, along: 0, mode: 'sim', playing: true, simMult: 4, follow: true,
          csPassed: false, arrived: false, spoken: {}, pos: r.ll[0], heading: h0,
          lastFrame: null, lastUi: 0, raf: null, watchId: null, offCount: 0, offRoute: false, csPauseUntil: 0
        };
        viewHeading = h0;
        document.body.classList.remove('setup');
        document.body.classList.add('nav');
        ['setup', 'sheetSetup'].forEach(function (id) { $(id).classList.add('hidden'); });
        ['banner', 'fabs', 'signs', 'sheetNav'].forEach(function (id) { $(id).classList.remove('hidden'); });
        csLayer.eachLayer(function (l) { l.setStyle({ opacity: 0.5, fillOpacity: 0.4 }); });
        if (mOrig) mOrig.setStyle({ opacity: 0, fillOpacity: 0 });
        drawRoute(r, false);
        if (mMe) map.removeLayer(mMe);
        mMe = L.marker(r.ll[0], { icon: meIcon, zIndexOffset: 1000, interactive: false }).addTo(map);
        map.setView(r.ll[0], 18, { animate: false });
        setView3d(viewPref3d);
        drawMyLocation();
        refreshNavChips();
        updateNav(true);
        var first = nextManeuvers(r, 0, false)[0];
        speak(T('startSay', { i: (r.steps[0] && r.steps[0].instruction) || '' }) + (first ? '。' + (first.step.instruction || '') : ''));
        requestWakeLock();
        nav.raf = requestAnimationFrame(tick);
        tryAutoGps();
        var seen = null;
        try { seen = localStorage.getItem('kah_navi_help_seen'); } catch (e) { seen = null; }
        if (!seen) openHelp();
      }

      function endNav() {
        if (!nav) return;
        if (nav.raf) cancelAnimationFrame(nav.raf);
        if (nav.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(nav.watchId);
        nav = null;
        setView3d(false);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        releaseWakeLock();
        if (mMe) { map.removeLayer(mMe); mMe = null; }
        drawMyLocation();
        document.body.classList.remove('nav');
        document.body.classList.add('setup');
        ['banner', 'fabs', 'signs', 'sheetNav', 'recenter'].forEach(function (id) { $(id).classList.add('hidden'); });
        ['setup', 'sheetSetup'].forEach(function (id) { $(id).classList.remove('hidden'); });
        csLayer.eachLayer(function (l) { l.setStyle({ opacity: 1, fillOpacity: 0.85 }); });
        if (mOrig) mOrig.setStyle({ opacity: 1, fillOpacity: 1 });
        if (routes[sys]) { drawRoute(routes[sys], true); showSummary(routes[sys]); }
      }

      function tick(ts) {
        if (!nav) return;
        var dt = nav.lastFrame == null ? 0 : Math.min(0.25, (ts - nav.lastFrame) / 1000);
        nav.lastFrame = ts;
        if (nav.mode === 'sim' && nav.playing && !nav.arrived && Date.now() >= nav.csPauseUntil) {
          nav.along = Math.min(nav.route.total, nav.along + nav.route.walk * nav.simMult * dt);
          var p = pointAt(nav.route, nav.along);
          nav.pos = p.latlng;
          nav.heading = p.bearing;
        }
        var diff = ((nav.heading - viewHeading + 540) % 360) - 180;
        viewHeading = (viewHeading + diff * Math.min(1, dt * 3.5) + 360) % 360;
        apply3dTransform();
        updateNav(false);
        nav.raf = requestAnimationFrame(tick);
      }

      // 画面上で「自分」を置く位置（バナーとシートの間）
      function anchorPoint(is3d) {
        var stage = $('stage').getBoundingClientRect();
        var bnRect = $('banner').getBoundingClientRect();
        var shRect = $('sheet').getBoundingClientRect();
        if (document.body.classList.contains('ui-pc')) {
          return {
            x: (shRect.right - stage.left) + (stage.right - shRect.right) / 2,
            y: stage.height * (is3d ? 0.74 : 0.62)
          };
        }
        var top = bnRect.bottom - stage.top, bottom = shRect.top - stage.top;
        return {
          x: stage.width / 2,
          y: bottom > top + 40 ? top + (bottom - top) * (is3d ? 0.8 : 0.7) : stage.height * 0.6
        };
      }

      // ---------- 歩行者視点（3D・進行方向が上） ----------
      // 地図要素を自分の位置を中心とする正方形に広げ、CSS で回転＋手前に傾ける。
      // 正方形の角が視点より手前に出ないよう（Safari で描画が消える）半径を perspective から決める。
      function layoutMap() {
        var el = $('map'), wrap = $('mapWrap');
        if (!view3d) {
          el.style.width = el.style.height = el.style.left = el.style.top = el.style.transform = '';
          wrap.style.perspective = wrap.style.perspectiveOrigin = '';
          map.invalidateSize({ pan: false });
          return;
        }
        var stageBox = $('stage').getBoundingClientRect();
        var H = stageBox.height;
        var a = anchorPoint(true);
        var p = Math.round(Math.max(H, 480) * 1.4);
        var s = Math.sin(TILT_DEG * Math.PI / 180), c = Math.cos(TILT_DEG * Math.PI / 180);
        var r = 0.62 * p / s;
        var D = Math.ceil(2 * r);
        el.style.width = D + 'px';
        el.style.height = D + 'px';
        el.style.left = Math.round(a.x - D / 2) + 'px';
        el.style.top = Math.round(a.y - D / 2) + 'px';
        wrap.style.perspective = p + 'px';
        wrap.style.perspectiveOrigin = Math.round(a.x) + 'px ' + Math.round(a.y) + 'px';
        var horizon = a.y - r * c * p / (p + r * s);
        $('fog').style.top = Math.round(horizon - 24) + 'px';
        $('fog').style.height = Math.round(Math.max(120, H * (stageBox.width > H ? 0.36 : 0.22))) + 'px';
        map.invalidateSize({ pan: false });
        apply3dTransform();
        if (nav) map.setView(nav.pos, map.getZoom() < 17 ? 18 : map.getZoom(), { animate: false });
      }
      function apply3dTransform() {
        if (!view3d) return;
        $('map').style.transform = 'rotateX(' + TILT_DEG + 'deg) rotateZ(' + (-viewHeading).toFixed(2) + 'deg)';
      }
      function setView3d(on) {
        view3d = !!on;
        document.body.classList.toggle('v3d', view3d);
        // 3D 変形中は Leaflet のポインタ座標計算が合わないため、地図操作を止める
        ['dragging', 'touchZoom', 'scrollWheelZoom', 'doubleClickZoom', 'boxZoom', 'keyboard'].forEach(function (h) {
          if (map[h]) { if (view3d) map[h].disable(); else map[h].enable(); }
        });
        if (nav) { viewHeading = nav.heading; nav.follow = true; $('recenter').classList.add('hidden'); }
        layoutMap();
        refresh3dFab();
        if (nav) followMap();
      }
      function refresh3dFab() {
        var fab = $('fab3d');
        fab.classList.toggle('on', view3d);
        fab.innerHTML = '<span style="font-size:15px;font-weight:800;line-height:1">' + (view3d ? '3D' : '2D') + '</span>' +
          '<span class="fab-l">' + (view3d ? T('v3d') : T('v2d')) + '</span>';
      }
      $('fab3d').onclick = function () {
        if (!nav) return;
        viewPref3d = !view3d;
        setView3d(viewPref3d);
        toast(viewPref3d ? T('to3d') : T('to2d'), 3000);
      };

      // ---------- 使い方 ----------
      function openHelp() {
        $('helpTitle').textContent = T('helpTitle');
        $('helpList').innerHTML = ['help1', 'help2', 'help3', 'help4', 'help5']
          .map(function (k) { return '<li>' + T(k) + '</li>'; }).join('');
        $('btnHelpOk').textContent = T('helpOk');
        $('navHelp').classList.remove('hidden');
        if (nav && nav.mode === 'sim' && nav.playing) {
          nav.playing = false;
          nav.resumeAfterHelp = true;
          refreshNavChips();
        }
      }
      function closeHelp() {
        $('navHelp').classList.add('hidden');
        if (nav && nav.resumeAfterHelp) {
          nav.resumeAfterHelp = false;
          nav.playing = true;
          refreshNavChips();
        }
        try { localStorage.setItem('kah_navi_help_seen', '1'); } catch (e) { /* noop */ }
      }
      $('fabHelp').onclick = openHelp;
      $('btnHelpOk').onclick = closeHelp;
      $('navHelp').onclick = function (e) { if (e.target === this) closeHelp(); };
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { syncUiChrome(); fitSetup(); layoutMap(); if (nav) followMap(); }, 120);
      });

      function followMap() {
        if (!nav || !nav.follow) return;
        var z = map.getZoom() < 17 ? 18 : map.getZoom();
        if (view3d) {
          map.setView(nav.pos, z, { animate: false });
          return;
        }
        var a = anchorPoint(false);
        var size = map.getSize();
        var pt = map.project(nav.pos, z);
        var shift = L.point(size.x / 2 - a.x, size.y / 2 - a.y);
        map.setView(map.unproject(pt.add(shift), z), z, { animate: false });
      }

      function updateNav(force) {
        if (!nav) return;
        var r = nav.route;
        if (mMe) {
          mMe.setLatLng(nav.pos);
          var el = mMe.getElement();
          var svg = el && el.querySelector('.me');
          if (svg) svg.style.transform = 'rotate(' + nav.heading.toFixed(1) + 'deg)' + (view3d ? ' scale(1.8)' : '');
        }
        followMap();

        if (r.csAlong != null && !nav.csPassed && nav.along >= r.csAlong - 3) {
          nav.csPassed = true;
          var msg = T('csArrive', { n: r.csName || 'CS' });
          toast(msg, 4500);
          speak(msg);
          if (nav.mode === 'sim') nav.csPauseUntil = Date.now() + 2500;
        }
        if (!nav.arrived && nav.along >= r.total - 6) {
          nav.arrived = true;
          speak(T('arrived'));
        }

        var now = performance.now();
        if (!force && now - nav.lastUi < 200) return;
        nav.lastUi = now;

        var segI = segAt(r, nav.along);
        if (traveledLine) traveledLine.setLatLngs(displayLatLngs(r.ll.slice(0, segI + 1).concat([nav.pos])));

        var main = $('bnMain');
        main.classList.remove('off', 'done');
        if (nav.arrived) {
          main.classList.add('done');
          $('bnArrow').innerHTML = arrowSvg({ type: 'arrive' });
          $('bnDist').textContent = '';
          $('bnRoad').textContent = T('arrived');
          $('bnSub').textContent = T('arrivedSub');
          $('bnThen').classList.add('hidden');
          main.classList.remove('with-then');
        } else if (nav.offRoute) {
          main.classList.add('off');
          $('bnArrow').innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';
          $('bnDist').textContent = '';
          $('bnRoad').textContent = T('offRoute');
          $('bnSub').textContent = T('reroute');
          $('bnThen').classList.add('hidden');
          main.classList.remove('with-then');
        } else {
          var nx = nextManeuvers(r, nav.along, nav.csPassed);
          var n1 = nx[0], n2 = nx[1];
          if (n1) {
            var d1 = Math.max(0, n1.step.along - nav.along);
            $('bnArrow').innerHTML = arrowSvg(n1.step);
            $('bnDist').textContent = fmtDist(d1);
            $('bnRoad').textContent = n1.step.type === 'waypoint' ? (r.csName || 'CS')
              : (n1.step.type === 'arrive' ? (destLabel || T('destination')) : (n1.step.road || ''));
            $('bnSub').textContent = n1.step.instruction || '';
            var key = 'n' + n1.i;
            if (d1 <= 35 && !nav.spoken[key]) {
              nav.spoken[key] = true;
              speak(d1 < 8 ? n1.step.instruction : T('ahead', { d: fmtDist(d1), i: n1.step.instruction }));
            }
          }
          if (n2) {
            $('bnThenArrow').innerHTML = arrowSvg(n2.step);
            $('bnThenRoad').textContent = '';
            $('bnThen').classList.remove('hidden');
            main.classList.add('with-then');
          } else {
            $('bnThen').classList.add('hidden');
            main.classList.remove('with-then');
          }
        }

        var remain = Math.max(0, r.total - nav.along);
        var remainS = remain / r.walk + (nav.csPassed || r.csAlong == null ? 0 : r.dwell);
        $('etaTime').textContent = nav.arrived ? T('arrived') : fmtDur(remainS);
        var eta = new Date(Date.now() + remainS * 1000);
        $('etaSub').textContent = fmtDist(remain) + ' · ' + fmtClock(eta) + ' ' + T('arriveAt') +
          (!nav.csPassed && r.csAlong != null ? T('inclDwell') : '');

        var nowShade = r.segShade.length ? (r.segShade[segI] || 0) : null;
        var signNow = $('signNow');
        if (nowShade == null) {
          signNow.className = 'sign';
          $('signNowV').textContent = '—';
        } else if (nowShade >= 0.5) {
          signNow.className = 'sign shade';
          $('signNowV').textContent = T('shade');
        } else {
          signNow.className = 'sign sun';
          $('signNowV').textContent = T('sun');
        }
        $('signNowL').textContent = T('here');
        $('signRestV').textContent = pct(shadeAhead(r, nav.along));
      }

      function refreshNavChips() {
        if (!nav) return;
        var cm = $('chipMode');
        cm.innerHTML = (nav.mode === 'gps' ? ICON_GPS + T('gps') : ICON_SIM + T('sim'));
        cm.classList.toggle('on', nav.mode === 'gps');
        $('chipPlay').classList.toggle('hidden', nav.mode !== 'sim');
        $('chipSpeed').classList.toggle('hidden', nav.mode !== 'sim');
        $('chipPlay').innerHTML = nav.playing ? ICON_PAUSE + T('pause') : ICON_PLAY + T('play');
        $('chipSpeed').textContent = '×' + nav.simMult;
        $('fabVoice').innerHTML = (voiceOn ? ICON_VOICE_ON : ICON_VOICE_OFF) + '<span class="fab-l">' + (voiceOn ? T('voiceOn') : T('voiceOff')) + '</span>';
        $('fabVoice').classList.toggle('on', voiceOn);
      }

      $('chipPlay').onclick = function () {
        if (!nav) return;
        nav.playing = !nav.playing;
        if (nav.arrived && nav.playing) {
          nav.along = 0; nav.arrived = false; nav.csPassed = false; nav.spoken = {};
        }
        refreshNavChips();
      };
      $('chipSpeed').onclick = function () {
        if (!nav) return;
        var opts = [1, 4, 10];
        nav.simMult = opts[(opts.indexOf(nav.simMult) + 1) % opts.length];
        refreshNavChips();
      };
      $('chipMode').onclick = function () {
        if (!nav) return;
        if (nav.mode === 'gps') setSimMode(); else startGps(false);
      };
      $('fabVoice').onclick = function () {
        voiceOn = !voiceOn;
        if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
        refreshNavChips();
      };
      $('fabShade').onclick = function () {
        shadeColoring = !shadeColoring;
        $('fabShade').classList.toggle('on', shadeColoring);
        var r = nav ? nav.route : routes[sys];
        if (r) drawRoute(r, false);
        if (nav) updateNav(true);
      };
      $('fabOverview').onclick = function () {
        if (!nav) return;
        if (view3d) setView3d(false);
        nav.follow = false;
        $('recenter').classList.remove('hidden');
        map.fitBounds(L.latLngBounds(nav.route.ll), { padding: [60, 60], maxZoom: 17 });
      };
      $('recenter').onclick = function () {
        if (!nav) return;
        nav.follow = true;
        $('recenter').classList.add('hidden');
        if (viewPref3d && !view3d) setView3d(true);
        else followMap();
      };
      map.on('dragstart', function () {
        if (!nav) return;
        nav.follow = false;
        $('recenter').classList.remove('hidden');
      });

      // ---------- GPS ----------
      function setSimMode() {
        if (!nav) return;
        if (nav.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(nav.watchId);
        nav.watchId = null;
        nav.mode = 'sim';
        nav.offRoute = false;
        nav.playing = true;
        refreshNavChips();
        drawMyLocation();
        updateNav(true);
      }
      function tryAutoGps() {
        if (!navigator.geolocation || !window.isSecureContext) return;
        navigator.geolocation.getCurrentPosition(function (pos) {
          if (!nav) return;
          var pr = projectOnRoute(nav.route, pos.coords.latitude, pos.coords.longitude);
          if (pr.dist <= 150) startGps(true);
          else toast(T('farSim'), 4000);
        }, function () { /* 許可なし → シミュレーションのまま */ }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 10000 });
      }
      function startGps(auto) {
        if (!nav) return;
        if (!navigator.geolocation) { toast(T('gpsNg')); return; }
        nav.mode = 'gps';
        nav.playing = false;
        refreshNavChips();
        drawMyLocation();
        if (nav.watchId != null) navigator.geolocation.clearWatch(nav.watchId);
        nav.watchId = navigator.geolocation.watchPosition(onGps, function () {
          toast(T('gpsNg'));
          setSimMode();
        }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
        if (auto) toast(T('gpsOn'), 2500);
      }
      function onGps(pos) {
        if (!nav || nav.mode !== 'gps') return;
        var lat = pos.coords.latitude, lon = pos.coords.longitude;
        var pr = projectOnRoute(nav.route, lat, lon);
        nav.pos = [lat, lon];
        if (pos.coords.heading != null && isFinite(pos.coords.heading) && (pos.coords.speed || 0) > 0.3) {
          nav.heading = pos.coords.heading;
        } else {
          nav.heading = pointAt(nav.route, pr.along).bearing;
        }
        if (pr.dist > 40) {
          nav.offCount += 1;
          if (nav.offCount >= 2) nav.offRoute = true;
        } else {
          nav.offCount = 0;
          nav.offRoute = false;
          if (pr.along > nav.along - 30) nav.along = pr.along;
        }
        updateNav(true);
      }
      $('bnMain').onclick = function (e) {
        if (!nav || !nav.offRoute) return;
        if (e.target.closest('#bnSearch')) return;
        reroute();
      };
      async function reroute() {
        if (!nav) return;
        var here = nav.pos;
        var keepCs = nav.csPassed ? null : nav.route.csId;
        var skipCs = nav.csPassed || nav.route.csId == null;
        var savedOrig = orig;
        orig = { lat: here[0], lon: here[1], fromHere: true };
        busy(true, T('computing'));
        try {
          var r = buildRoute(await requestRoute(sys, keepCs, skipCs), sys);
          routes = { old: null, new: null };
          routes[sys] = r;
          fixedVisitCsId = r.csId;
          nav.route = r;
          nav.along = 0;
          nav.csPassed = false;
          nav.spoken = {};
          nav.offRoute = false;
          nav.offCount = 0;
          origLabel = T('myLoc');
          drawRoute(r, false);
          updateNav(true);
        } catch (e) {
          orig = savedOrig;
          toast(T('errPrefix') + e.message, 5000);
        } finally {
          busy(false);
        }
      }

      async function requestWakeLock() {
        try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
      }
      function releaseWakeLock() {
        try { if (wakeLock) wakeLock.release(); } catch (e) { /* noop */ }
        wakeLock = null;
      }

      $('btnStart').onclick = startNav;
      $('btnEnd').onclick = endNav;
      $('bnSearch').onclick = function (e) { e.stopPropagation(); endNav(); };

      // ---------- 画面切り替え（通常表示 ⇄ ナビ表示） ----------
      $('btnBackMap').onclick = function () {
        location.href = (sys === 'new' ? '/new' : '/') + (isEn ? '?lang=en' : '');
      };
      $('btnLang').onclick = function () {
        var p = new URLSearchParams(location.search);
        if (isEn) p.delete('lang'); else p.set('lang', 'en');
        p.set('sys', sys);
        p.delete('from');
        var q = p.toString();
        location.href = location.pathname + (q ? '?' + q : '');
      };

      function loadHandoff() {
        if (params.get('from') !== 'map') return false;
        var raw = null;
        try { raw = sessionStorage.getItem('kah_navi_handoff'); } catch (e) { raw = null; }
        if (!raw) return false;
        try {
          var h = JSON.parse(raw);
          var q = h.req;
          if (!q || !h.res) return false;
          if (q.factors) baseFactors = Object.assign({}, baseFactors, q.factors);
          syncFactorChecks();
          $('useCs').checked = !(q.factors && q.factors.use_cooling_shelter === false);
          refreshCsToggle();
          if (h.sys === 'new' || h.sys === 'old') sys = h.sys;
          if (q.route_date) $('routeDate').value = q.route_date;
          if (q.hour != null) {
            if (!Array.prototype.some.call($('hour').options, function (o) { return o.value === String(q.hour); })) {
              var o = document.createElement('option');
              o.value = String(q.hour);
              o.textContent = String(q.hour).padStart(2, '0') + ':00';
              $('hour').appendChild(o);
            }
            $('hour').value = String(q.hour);
          }
          setOrig(q.orig_lat, q.orig_lon, h.origLabel || null);
          setDest(q.dest_lat, q.dest_lon, h.destLabel || null);
          var r = buildRoute(h.res, sys);
          routes[sys] = r;
          fixedVisitCsId = r.csId;
          refreshSysUi();
          drawRoute(r, true);
          showSummary(r);
          return true;
        } catch (e) {
          return false;
        }
      }
      function loadUrlParams() {
        var olat = parseFloat(params.get('olat')), olon = parseFloat(params.get('olon'));
        var dlat = parseFloat(params.get('dlat')), dlon = parseFloat(params.get('dlon'));
        if (params.get('date')) $('routeDate').value = params.get('date');
        if (params.get('hour')) $('hour').value = params.get('hour');
        if (params.get('cs') === '0') { $('useCs').checked = false; refreshCsToggle(); }
        if (isFinite(olat) && isFinite(olon)) setOrig(olat, olon);
        if (isFinite(dlat) && isFinite(dlon)) setDest(dlat, dlon);
        return !!(orig && dest);
      }

      // ---------- 起動 ----------
      (async function init() {
        applyI18n();
        refreshSysUi();
        setStatus(T('connecting'));
        try {
          await fetchJson(apiUrl('/api/health'));
        } catch (e) {
          setStatus(T('apiOff') + ' ' + e.message, 'err');
          return;
        }
        await loadMeta();
        try { await loadCoolingShelters(); } catch (e) { /* CS なしでも検索は可能 */ }
        applyI18n();
        var routed = loadHandoff();
        if (!routed && loadUrlParams()) {
          setStatus(T('ready'));
          $('btnSearch').click();
          routed = true;
        }
        if (!routed) setStatus(T('ready'));
      })();
    })();
  </script>
  </div>
</body>
</html>
